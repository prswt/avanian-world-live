:root{
  --gut:clamp(12px,3.4vw,32px);--g8:8px;
  --ink:#241F2E;--ink2:#514C60;--paper:#FFFDF8;
  --lilac:#8D78E0;--mint:#4FA37E;--peach:#E08A4E;--sky:#5B93CF;--pink:#DF7FA5;--sun:#F2C53D;
  --tag:var(--sun);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#BFE3EA}
body{font-family:'Koodak',Tahoma,sans-serif;font-weight:500;color:var(--ink);background:#BFE3EA;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:3px;border-radius:10px}

#world{position:relative;width:100%;overflow:hidden;background:#fff;direction:ltr}
#world svg{display:block;max-width:none;height:auto}

/* top bar */
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut) 0;pointer-events:none;z-index:5}
.brand{font-weight:900;font-size:clamp(15px,4.8vw,20px);line-height:1;white-space:nowrap;padding:10px clamp(12px,3.6vw,18px) 11px;
  border-radius:999px;background:rgba(255,253,248,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.count{font-weight:700;font-size:14px;padding:8px 14px 9px;border-radius:999px;background:rgba(255,253,248,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink2)}

/* rail */
#rail{position:fixed;left:var(--gut);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
#rail button{position:relative;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
#rail button i{display:block;width:10px;height:10px;border-radius:50%;background:rgba(36,31,46,.35);
  box-shadow:0 0 0 2px rgba(255,255,255,.75);transition:transform .35s cubic-bezier(.3,1.7,.5,1),background .25s}
#rail button:hover i{transform:scale(1.5)}
#rail button.on i{transform:scale(1.7);background:var(--c,var(--lilac))}
#rail button span{position:absolute;left:34px;top:50%;transform:translateY(-50%) translateX(-6px);white-space:nowrap;font-weight:700;font-size:13px;
  padding:5px 11px 6px;border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:.2s}
#rail button:hover span,#rail button:focus-visible span{opacity:1;transform:translateY(-50%)}

/* story card: a small panel in the bottom corner away from the island it talks about; it folds into a pill */
#card{position:fixed;z-index:4;width:min(372px,calc(100vw - 96px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none}
#card[data-side="R"]{right:var(--gut)}
#card[data-side="L"]{left:calc(var(--gut) + 44px)}
#card.min{width:auto;max-width:calc(100vw - 96px)}
.card-in{pointer-events:auto;position:relative;padding:14px 18px 12px;border-radius:26px;background:rgba(255,253,248,.9);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:2px solid rgba(255,255,255,.9);box-shadow:0 6px 24px rgba(36,31,46,.12)}
.card-in:empty{display:none}
.card-in.in{animation:cardIn .55s cubic-bezier(.2,1.2,.3,1) both}
.card-in.out{animation:cardOut .2s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.95)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(10px) scale(.97)}}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:5px 13px 6px;border-radius:999px;
  background:color-mix(in srgb,var(--tag) 22%,#fff);color:color-mix(in srgb,var(--tag) 62%,#241F2E);white-space:nowrap}
.chip b{font-weight:900;font-size:15px}
.cmin{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--ink2);background:rgba(36,31,46,.07);transition:transform .3s cubic-bezier(.3,1.5,.5,1),background .2s}
.cmin:hover{background:rgba(36,31,46,.14)}
#card.min .cmin{transform:rotate(180deg)}
.card-in h2{font-weight:900;font-size:clamp(20px,1.7vw,24px);line-height:1.4;margin:10px 0 4px}
.card-in p{font-size:clamp(14.5px,1.1vw,16px);line-height:1.95;color:var(--ink2)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1.5px solid rgba(36,31,46,.08)}
.cb{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:#fff;transition:transform .25s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.cb:hover:not(:disabled){transform:scale(1.1)}
.cb:active:not(:disabled){transform:scale(.94)}
.cb:disabled{opacity:.22;cursor:default}
.cdots{display:flex;gap:6px;align-items:center}
.cdots i{width:7px;height:7px;border-radius:50%;background:rgba(36,31,46,.2);transition:all .3s}
.cdots i.on{width:20px;border-radius:5px;background:var(--tag)}
#card.min .card-in{padding:7px 8px 7px 12px;border-radius:999px;cursor:pointer}
#card.min .cbody,#card.min .cnav{display:none}
#card.min .cmin{width:28px;height:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:900;font-size:16px;line-height:1;
  padding:12px 22px 13px;border-radius:999px;background:var(--ink);color:#fff;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.btn:hover{transform:translateY(-3px) scale(1.04)}
.btn:active{transform:scale(.97)}
.btn.soft{background:color-mix(in srgb,var(--tag) 24%,#fff);color:var(--ink)}

/* hint */
#hint{position:fixed;z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .4s,transform .4s;pointer-events:none}
#hint.gone{opacity:0;transform:translate(-50%,16px)}
#hint b{font-weight:700;font-size:14px;padding:6px 14px 7px;border-radius:999px;background:rgba(255,253,248,.85)}
.mouse{width:26px;height:42px;border-radius:14px;border:3px solid var(--ink);background:rgba(255,253,248,.75);display:block;position:relative}
.mouse i{position:absolute;left:50%;top:7px;width:5px;height:9px;margin-left:-2.5px;border-radius:3px;background:var(--ink);animation:wheel 1.6s infinite cubic-bezier(.5,0,.2,1)}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(13px);opacity:0}100%{opacity:0}}

/* owl's speech bubble */
#bubble{position:fixed;z-index:6;max-width:230px;padding:11px 16px 13px;border-radius:20px 20px 20px 6px;background:#fff;
  font-weight:700;font-size:16px;line-height:1.7;opacity:0;pointer-events:none;transform:translate(-50%,-100%) scale(.6);
  transform-origin:50% 100%;transition:opacity .2s,transform .45s cubic-bezier(.3,1.7,.5,1);box-shadow:0 0 0 2px rgba(36,31,46,.9)}
#bubble.on{opacity:1;transform:translate(-50%,-100%) scale(1)}

/* ---------- art animations (inside the SVG) ---------- */
svg .cl-puff{transform-box:fill-box;transform-origin:50% 90%;cursor:pointer}
svg .cl-puff.pop{animation:clPop .75s cubic-bezier(.3,1,.4,1)}
@keyframes clPop{0%{transform:scale(1,1)}18%{transform:scale(1.2,.72)}42%{transform:scale(.88,1.2)}66%{transform:scale(1.07,.95)}100%{transform:scale(1,1)}}
svg .cl-face{opacity:0;transition:opacity .25s;pointer-events:none}
svg .cl-puff:hover .cl-face,svg .cl-puff.pop .cl-face,svg .cl-puff.awake .cl-face{opacity:1}
svg .cl-puff:hover{animation:clHover 1.6s ease-in-out infinite}
@keyframes clHover{0%,100%{transform:scale(1.04,1.02)}50%{transform:scale(1.07,.97)}}
svg .cl-puff.pop,svg .cl-puff.pop:hover{animation:clPop .75s cubic-bezier(.3,1,.4,1)}
svg .rain{fill:#4EB9E8;animation:rain 1.1s ease-in forwards;pointer-events:none}
@keyframes rain{0%{opacity:0;translate:0 0}12%{opacity:.95}100%{opacity:0;translate:var(--rx,0px) 170px}}

svg .wf-hit{cursor:pointer}
svg .mist ellipse{fill:#fff;transform-box:fill-box;transform-origin:50% 100%;animation:mist 3.4s ease-out infinite;opacity:0}
svg .mist ellipse:nth-child(2){animation-delay:1.1s}
svg .mist ellipse:nth-child(3){animation-delay:2.2s}
@keyframes mist{0%{opacity:0;transform:scale(.5,.3)}25%{opacity:.55}100%{opacity:0;transform:scale(1.5,1.2) translateY(-10px)}}
svg .drop{fill:#fff;opacity:0;animation:drop var(--t,1.8s) var(--d,0s) infinite cubic-bezier(.3,.6,.5,1)}
@keyframes drop{0%{opacity:0;translate:0 0}12%{opacity:.95}50%{translate:var(--dx,10px) calc(var(--dy,40px)*-1)}100%{opacity:0;translate:calc(var(--dx,10px)*1.9) 6px}}
svg .foam{fill:#fff;transform-box:fill-box;transform-origin:50% 50%;animation:foam 2.4s ease-in-out var(--d,0s) infinite alternate;opacity:.75}
@keyframes foam{from{transform:scale(.8,.7) translateX(-6px)}to{transform:scale(1.2,1) translateX(6px)}}
svg .splash{fill:#fff;pointer-events:none;animation:splash .9s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes splash{0%{opacity:1;translate:0 0}100%{opacity:0;translate:var(--sx,0px) var(--sy,-60px)}}


/* clouds: very slow, independent, random drift (not tied to scroll) */
svg .cl-drift{animation:clDrift var(--t1,60s) ease-in-out var(--d1,0s) infinite alternate}
svg .cl-sway{animation:clSway var(--t2,23s) ease-in-out var(--d2,0s) infinite alternate}
@keyframes clDrift{from{translate:var(--ax0,-70px) var(--ay0,-6px)}to{translate:var(--ax1,70px) var(--ay1,8px)}}
@keyframes clSway{from{translate:-14px 3px}to{translate:16px -4px}}
svg .cl-eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

/* Zaniyar: parts named and grouped in Illustrator, animated one by one */
svg .z-all{cursor:pointer;animation:zBreath 3.6s ease-in-out infinite}
@keyframes zBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.99)}}
svg .z-all.hop{animation:zHop .9s cubic-bezier(.3,.9,.4,1)}
@keyframes zHop{0%{transform:scale(1,1);translate:0 0}16%{transform:scale(1.12,.8);translate:0 0}46%{transform:scale(.92,1.14);translate:0 -34px}74%{transform:scale(1.08,.9);translate:0 0}100%{transform:scale(1,1);translate:0 0}}
svg .z-wr{animation:zWingR 5.5s ease-in-out infinite}
@keyframes zWingR{0%,100%{rotate:0deg}50%{rotate:2.5deg}}
svg .z-all.wave .z-wr,svg .z-all:hover .z-wr{animation:zWave 1.9s ease-in-out}
svg .z-all.hop .z-wr{animation:zWave 1.4s ease-in-out}
@keyframes zWave{0%,100%{rotate:0deg}12%{rotate:-22deg}27%{rotate:9deg}42%{rotate:-22deg}57%{rotate:9deg}72%{rotate:-18deg}87%{rotate:3deg}}
svg .z-wl{animation:zWingL 6.4s ease-in-out infinite}
@keyframes zWingL{0%,100%{rotate:0deg}50%{rotate:-3deg}}
svg .z-all.flap .z-wl,svg .z-all.hop .z-wl{animation:zFlapL 1.2s ease-in-out}
@keyframes zFlapL{0%,100%{rotate:0deg}18%{rotate:14deg}36%{rotate:-2deg}54%{rotate:14deg}72%{rotate:0deg}}
svg .z-fl.tap{animation:zTap .9s ease-in-out}
svg .z-fr.tap{animation:zTapR .9s ease-in-out}
svg .z-all.hop .z-fl,svg .z-all.hop .z-fr{animation:zTuck .9s ease-in-out}
@keyframes zTap{0%,100%{rotate:0deg;translate:0 0}30%{rotate:-14deg;translate:0 -70px}60%{rotate:4deg;translate:0 0}}
@keyframes zTapR{0%,100%{rotate:0deg;translate:0 0}30%{rotate:14deg;translate:0 -70px}60%{rotate:-4deg;translate:0 0}}
@keyframes zTuck{0%,100%{rotate:0deg}40%,60%{rotate:-12deg}}
svg .z-eyes{animation:blink 5s infinite}
svg .z-beak.talk{animation:zTalk .26s ease-in-out infinite}
@keyframes zTalk{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.45)}}
svg .z-brows{transition:translate .25s}
svg .z-all.hop .z-brows,svg .z-all:hover .z-brows{translate:0 -60px}

@media (max-width:759px),(max-aspect-ratio:4/5){
  #card,#card[data-side]{width:auto;left:var(--gut)!important;right:var(--gut)!important;bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
  #card.min,#card.min[data-side]{left:var(--gut)!important;right:auto!important;width:auto}
  .card-in{padding:12px 14px 10px;border-radius:24px}
  .card-in h2{font-size:19px;margin:8px 0 2px}
  .card-in p{font-size:14px;line-height:1.85}
  .cb{width:38px;height:38px}
  .btn{font-size:15px;padding:11px 18px 12px}
  #rail{left:auto;right:calc(var(--gut) - 4px);top:50%}
  #rail button span{display:none}
  #hint{display:none}
  .count{display:none}
  .mode{width:58px;height:32px}.mode .knob{width:24px;height:24px}body.night .mode .knob{transform:translateX(26px)}.mode svg{top:7px}.mode .i-sun{left:35px}
}
/* short screens (a phone on its side): the card keeps the title and the buttons, the paragraph is left out */
@media (max-height:520px){
  #card{bottom:8px}
  .card-in{padding:8px 12px 8px}
  .card-in h2{font-size:17px;margin:6px 0 0}
  .card-in p{display:none}
  .cmin{width:28px;height:28px}.cb{width:32px;height:32px}
  .cnav{margin-top:6px;padding-top:6px}
  #rail{display:none}
}
@media (prefers-reduced-motion:reduce){
  svg *,.card-in,.mouse i{animation:none!important;transition:none!important}
}

/* the title lettering: on a laptop it is the big graphic on the page (left gutter); on a phone it sits in the top-right pill */
.brand{cursor:pointer}
.brand .bl{display:none}
@media (max-width:759px),(max-aspect-ratio:4/5){
  .brand .bt{display:none}
  .brand .bl{display:block;height:58px;width:auto;overflow:visible}
  .brand{padding:3px 12px 4px!important;display:grid;place-items:center}
  svg .logo-fit{display:none}
}

/* the portal to the Avanian website, floating on the sea at the last stop (layout() places it; ../portal/portal.css draws it) */
#world .aportal{position:absolute;margin:0;z-index:2;--sky:#F4F1FA;will-change:translate}
/* this page as the live view inside the website's portal: only the land, drifting */
html.in-portal #top,html.in-portal #rail,html.in-portal #card,html.in-portal #hint,html.in-portal #bubble,html.in-portal #avroot{display:none!important}

#avroot{
  --bg:#EAF8C8;--g1:#4FAF6B;--g2:#3C9A58;--g3:#6CC585;--g4:#DFF3C4;
  --ink:#1F2F26;--ink2:#566A5E;--card:#fff;--line:#E4EBDD;
  --or:#F7941D;--or2:#F5A04A;--yl:#FFD65C;--rd:#ED1C24;--bl:#0089CF;--pk:#F27BA0;--pu:#8D78E0;
  --top:calc(env(safe-area-inset-top,0px) + 14px);--bot:env(safe-area-inset-bottom,0px);
}#avroot *{box-sizing:border-box;margin:0;padding:0}#avroot,#avroot{height:100%}#avroot{font-family:'Koodak',Tahoma,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}#avroot button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}#avroot svg{display:block}#avroot :focus-visible{outline:3px solid var(--pu);outline-offset:2px;border-radius:12px}#avroot #stage{height:100%;display:block}#avroot .side{display:none}#avroot .frame{position:fixed;inset:0}#avroot .device{position:absolute;inset:0;overflow:hidden;background:var(--g1);isolation:isolate}#avroot .island{display:none}@media (min-width:820px) and (min-height:560px){#avroot #stage{display:flex;align-items:center;justify-content:center;gap:clamp(40px,7vw,110px);padding:24px;height:100%}#avroot .side{display:block;max-width:400px}#avroot .side .mark{width:96px;margin-bottom:14px}#avroot .side h1{font-weight:900;font-size:40px;line-height:1.3}#avroot .side p{margin-top:12px;font-size:17px;line-height:2;color:var(--ink2)}#avroot .side ul{list-style:none;margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}#avroot .side li button{font-weight:700;font-size:14px;padding:8px 14px 9px;border-radius:999px;background:#fff;box-shadow:0 2px 0 var(--line);transition:transform .2s cubic-bezier(.3,1.7,.5,1)}#avroot .side li button:hover{transform:translateY(-2px)}#avroot .side small{display:block;margin-top:22px;font-size:13px;line-height:1.9;color:var(--ink2);opacity:.9}#avroot .frame{position:relative;inset:auto;flex:none;width:calc(393px*var(--s,1));height:calc(852px*var(--s,1))}#avroot .device{inset:auto;left:0;top:0;width:393px;height:852px;border-radius:56px;border:10px solid #15171b;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 30px 60px rgba(60,100,40,.25)}#avroot .island{display:block;position:absolute;top:10px;left:50%;width:108px;height:30px;margin-left:-54px;border-radius:20px;backg /* characters and clickable icons, drawn inside the land */
svg .hit{cursor:pointer;outline:none}
svg .hit:hover{filter:brightness(1.07) drop-shadow(0 0 7px rgba(255,255,255,.85))}
svg .hit:focus-visible{filter:drop-shadow(0 0 0 #8D78E0) drop-shadow(0 0 8px #8D78E0)}
svg .wch-in{transform-box:fill-box;transform-origin:50% 100%;animation:wchBob var(--t,3.4s) ease-in-out var(--d,0s) infinite alternate;transition:filter 1.8s}
@keyframes wchBob{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-4px) scale(1.015,.99)}}
svg .wch.hop .wch-in{animation:wchHop .9s cubic-bezier(.3,.9,.4,1)}
@keyframes wchHop{0%{transform:scale(1,1)}16%{transform:scale(1.12,.8)}46%{transform:translateY(-40px) scale(.92,1.14)}74%{transform:scale(1.08,.9)}100%{transform:scale(1,1)}}
svg .wch .wsh{transform-box:fill-box;transform-origin:50% 50%}
svg .wch.hop .wsh{animation:wchSh .9s ease}
@keyframes wchSh{40%{transform:scale(.6);opacity:.15}}
svg.night .wch-in{filter:brightness(.72) saturate(.9) hue-rotate(-6deg)}
.hubbtn{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px 0 16px;border-radius:999px;background:linear-gradient(180deg,#5CC27A,#3E9A58);color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 #2F7A46;transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.hubbtn:hover{transform:translateY(-2px) scale(1.04)}.hubbtn:active{transform:scale(.95)}
.hubbtn b{font-weight:900;line-height:1;padding-top:2px}
.tools{display:flex;gap:10px;align-items:center;pointer-events:none}
.tbtn{pointer-events:auto;position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,253,248,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);transition:transform .25s cubic-bezier(.3,1.7,.5,1)}
.tbtn:hover{transform:scale(1.1)}.tbtn:active{transform:scale(.94)}
.tbtn span{position:absolute;top:46px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:12px;padding:3px 10px 4px;border-radius:999px;background:var(--ink);color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.tbtn:hover span,.tbtn:focus-visible span{opacity:1}
body.night .tbtn{background:rgba(24,26,64,.78);color:#ECE8FF}
@media (max-width:759px),(max-aspect-ratio:4/5){
  .tools{position:absolute;left:var(--gut);top:calc(env(safe-area-inset-top,0px) + 14px);gap:6px}
  .tbtn{width:40px;height:40px}.tbtn span{display:none}
  .hubbtn{width:40px;height:40px;padding:0;justify-content:center}.hubbtn b{display:none}
}

@keyframes pSwayL{from{rotate:0deg}to{rotate:3.5deg}}

/* portal.css: the dreamy doorway between the Avanian website and Avanian World (shared by both builds).

/* ---------------- layout: art fills the width, always (no white sides) ---------------- */
var W,H,AW,SC,ML,mobile,FOCUS=.5,idx=-1,panX=0;
function layout(){
  W=innerWidth;H=innerHeight;mobile=W<760||W/H<0.8;FOCUS=mobile?.38:.5; // the line of the screen where a stop sits: above the sheet on phones
  AW=W>=1000?W:Math.round(W*(W<520?2.5:W<760?1.9:1.2));   // phones show the land bigger, so the way down is longer and slower
  SC=AW/ART_W;
  ML=Math.round(clamp(W/2-720*SC,W-AW,0)); // keep the middle of the art in view on narrow screens
  svg.style.width=AW+'px';svg.style.height=(ART_H*SC)+'px';svg.style.marginLeft=ML+'px';panX=0;lastPan=null;svg.style.translate="0 0";
  world.style.height=(ART_H*SC)+'px';
  if(portalEl){var d=Math.round(clamp(PORTAL.d*SC,200,420));portalEl.style.setProperty('--d',d+'px');
    portalEl.style.left=(ML+PORTAL.x*SC-d/2)+'px';portalEl.style.top=(PORTAL.y*SC-d/2)+'px';portalEl.style.translate='0 0'}
  window.dispatchEvent(new Event("world:layout"));
}
function stopY(i){return STOPS[i].cy*SC}
function nearestStop(){
  if(window.scrollY+H>=document.documentElement.scrollHeight-4)return N-1;   // at the very bottom: the portal, which can't reach the focus line
  var y=(window.scrollY+H*FOCUS)/SC,best=0,bd=1e9;
  STOPS.forEach(function(s,i){var d=Math.abs(s.cy-y);if(d<bd){bd=d;best=i}});
  return best;

  $$('#rail button').forEach(function(b,k){b.classList.toggle('on',k===i)});
  $('#count').textContent=fa(i+1)+' از '+fa(N);
  clearTimeout(cardT);cardT=setTimeout(function(){if(idx===i)setCard(i,first)},first?0:140);
}
function buildRail(){
  var r=$('#rail');
  STOPS.forEach(function(s,i){
    var b=document.createElement('button');b.setAttribute('aria-label',s.name);b.style.setProperty('--c',s.tag);
    b.innerHTML='<i></i><span>'+s.name+'</span>';

// on screens narrower than the art, the art slides sideways as you scroll so each island is in the middle of the screen.
// It follows the scroll directly (no easing, so no lag) and only touches the page when the position really changed.
var PAN=[{y:0,x:720}].concat(STOPS.map(function(s){return {y:s.cy,x:s.px||s.cx}})).concat([{y:ART_H,x:820}]),lastPan=null;
var panCss=null;
function panForStop(i){                                // where the art sits sideways when island i is in focus
  var s=STOPS[i],x=s.px||s.cx;
  x=780+(x-780)*.7;                                      // 70% of the sideways distance only: calmer
  return Math.round((clamp(W/2-x*SC,W-AW,0)-ML)*2)/2;
}
function panArt(){
  if(AW<=W+4){if(panX||lastPan){panX=0;lastPan=0;svg.style.translate='0 0';svg.style.transition='none';if(portalEl)portalEl.style.translate='0 0'}return}
  var want=panForStop(nearestStop());
  if(want===lastPan)return;
  var first=lastPan===null;lastPan=want;panX=want;
  // a long, soft glide: the camera never snaps and never follows every pixel of the scroll
  svg.style.transition=(first||reduce)?'none':'translate 2.4s cubic-bezier(.4,.1,.25,1)';
  svg.style.translate=want+'px 0';
  if(portalEl){portalEl.style.transition=svg.style.transition;portalEl.style.translate=want+'px 0'}   // the portal moves with the land
}

/* ---------------- frame loop: water flow, Zaniyar's eyes and head, bubble ---------------- */
var lastT=performance.now(),lastPX=-1,lastPY=-1,headA=0,seen=false,wasIn=false,lastY=-1,hintGone=null,tick=0;
function frame(now){
  var dt=Math.min((now-lastT)/1000,0.05);lastT=now;tick++;
  var y=window.scrollY||0;
  if(y!==lastY){lastY=y;setIndex(nearestStop());panArt();var g=y>40;if(g!==hintGone){hintGone=g;$('#hint').classList.toggle('gone',g)}}
  if(!reduce&&!(mobile&&(tick&1))){            // water flows only while it is on screen (every other frame on phones)
    var top=y/SC-220,bot=(y+H)/SC+220,sdt=mobile?dt*2:dt;
    for(var i=0;i<falls.length;i++){var f=falls[i];if(f.y1!==undefined&&(f.y1<top||f.y0>bot))continue;f.off=(f.off+(f.speed+f.boost)*sdt)%220;f.rect.style.transform='translateY('+f.off.toFixed(1)+'px)'}
  }
  if(Z.all&&zr){
    var zl=ML+panX+zr.x*SC,zt=zr.y*SC-y,zw=zr.w*SC,zh=zr.h*SC,inView=zt+zh>0&&zt<H&&zl+zw>0&&zl<W;
    if(inView&&!wasIn){ // greets whenever he comes into view
      if(!seen){seen=true;setTimeout(function(){hop(false);say(LINES[0],4200)},900)}
      else setTimeout(function(){hop(false);say('زانیار دوباره سلام می‌کند!',2600)},500);
    }
    wasIn=inView;
    if(!reduce&&inView&&!(mobile&&tick%3)){
      // eyes and head follow the pointer, with a slow idle look-around
      var cx=zl+zw/2,cy=zt+zh*.28,dx=lastPX<0?0:lastPX-cx,dy=lastPY<0?0:lastPY-cy,l=Math.hypot(dx,dy)||1,m=Math.min(l/180,1);
      Z.pup.style.translate=(dx/l*m*18).toFixed(1)+'px '+(dy/l*m*11).toFixed(1)+'px';
      var tgt=clamp(dx/260,-1,1)*5+Math.sin(now/2300)*1.6+(talking?Math.sin(now/110)*1.2:0);
      headA+=(tgt-headA)*(1-Math.exp(-dt*(mobile?12:5)));
      Z.heads.forEach(function(h){h.style.rotate=headA.toFixed(2)+'deg'});
    }
  }
  if(talking)placeBubble();
  requestAnimationFrame(frame);
}
addEventListener('pointermove',function(e){lastPX=e.clientX;lastPY=e.clientY},{passive:true});

    function frameState(){

      if(st==='off'){lvl=0;if(e>3.4)go('turningOn')}
      else if(st==='turningOn'){
        var D=.8;e=Math.min(e,D);
        su=ease(seg(e,0,.22));sv=.012+ease(seg(e,.3,.8))*(1-.012);fl=e<.3?1:1-seg(e,.3,.8);
        lvl=seg(e,.2,.8);play_=seg(e,.55,.8);if(e>=D)go('on')}
      else if(st==='on'){su=1;sv=1;lvl=1;play_=1;if(e>7.6)go('turningOff')}
      else{                                                          // turningOff
        var D2=.85;e=Math.min(e,D2);
        var a=seg(e,0,.22),b=seg(e,.22,.5),c=seg(e,.5,.85);
        sv=1-(1-.012)*Math.pow(a,1.6);su=1-Math.pow(b,2.2);fl=a;lvl=1-seg(e,.1,.7);play_=1-seg(e,0,.12);
        dop=b>0?1-c:0;if(e>=D2){go('off');lvl=0}
      }
      return {su:su,sv:sv,fl:fl,dop:dop,play:play_};
    }
    window.__tvPower=function(on){if(on&&(st==='off'||st==='turningOff'))go('turningOn');else if(!on&&(st==='on'||st==='turningOn'))go('turningOff')};
    var glow=svg.querySelector('.tv-glow');
    var pcx,pcy;try{var pb=playPath.getBBox();pcx=pb.x+pb.width/2;pcy=pb.y+pb.height/2}catch(e){pcx=pcy=0}
    play.style.transformBox='fill-box';play.style.transformOrigin='50% 50%';
    function update(dt){
      clock+=dt;var s=frameState();
      var on=s.su>0.001&&s.sv>0.001;
      scr.style.display=on?'':'none';
      setScreen(Math.max(s.su,.0001),Math.max(s.sv,.0001));
      flash.setAttribute('opacity',s.fl.toFixed(3));
      dot.setAttribute('opacity',s.dop.toFixed(3));dot.setAttribute('r',(1.4+s.dop*.8).toFixed(2));
      // moving picture
      var c=clock;
      cloudA.setAttribute('transform','translate('+(((c*.07)%2.8)-1.4).toFixed(3)+' -.52)');
      cloudB.setAttribute('transform','translate('+(((c*.04+1.1)%2.4)-1.2).toFixed(3)+' -.2)');
      sun.setAttribute('transform','translate(.5 -.28) scale('+(1+.05*Math.sin(c*1.6)).toFixed(3)+') translate(-.5 .28)');
      band.setAttribute('y',(((c*.6)%2.6)-1.3).toFixed(3));
      // the play button and the little lights
      play.style.opacity=s.play.toFixed(3);
      var pulse=1+.07*Math.sin(clock*3.2),pop=s.play<1?.6+.4*ease(s.play):1;
      play.style.transform='scale('+(pulse*pop).toFixed(3)+')';
      if(ledA){ledA.style.fill=lvl>.5?'#A6CE39':'#FF5B4D';ledA.style.opacity=(lvl>.5?1:.55+.45*Math.sin(clock*2.2)).toFixed(3)}
      if(ledB){ledB.style.opacity=(lvl>.5?.35+.65*Math.abs(Math.sin(clock*1.8)):.08).toFixed(3)}
      if(glare)glare.style.opacity=(.14+.2*lvl).toFixed(3);
      if(glow)glow.style.opacity=(.85*lvl*(.85+.15*Math.sin(clock*2.6))).toFixed(3);
    }
    update(0);
    return {update:update,probe:body};
  })();

  /* one loop for both, paused while the icons are off screen */
  var last=performance.now(),ntime=0,vis={nb:true,tv:true},visAt=0;
  function onScreen(n){if(!n)return false;var r=n.getBoundingClientRect();return r.bottom>-120&&r.top<innerHeight+120&&r.right>-120&&r.left<innerWidth+120}
  function loop(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;
    if(window.__icons&&window.__icons.pause){requestAnimationFrame(loop);return}
    if(now-visAt>300){visAt=now;vis.nb=!!nb&&onScreen(nb.probe);vis.tv=!!tv&&onScreen(tv.probe)}
    if(vis.nb){ntime+=dt;nb.update(ntime)}
    if(vis.tv)tv.update(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__icons={nb:nb,tv:tv,seek:function(t){if(nb){ntime=t;nb.update(t)}}};
})();

/* perf.js: the land has hundreds of small endless animations (trees, clouds, drops, stars...). Only the ones near the screen run. */
(function(){
'use strict';
var svg=document.querySelector('#world svg');if(!svg||!document.getAnimations)return;
var list=[],busy=false,SC=1,margin=320,lastY=-1,lastOn=0;
function collect(){
  var sr=svg.getBoundingClientRect(),w=window.__world&&window.__world.view();SC=w?w.SC:1;
  list=[];
  document.getAnimations().forEach(function(a){
    var t=a.effect&&a.effect.target;if(!t||!svg.contains(t))return;
    var tm=a.effect.getComputedTiming&&a.effect.getComputedTiming();if(!tm||tm.iterations!==Infinity)return;    // only the endless ones
    var r=t.getBoundingClientRect();if(!r.width&&!r.height){try{a.pause()}catch(x){}return}   // not drawn (night things by day): nothing to animate
    list.push({a:a,y0:(r.top-sr.top)/SC,y1:(r.bottom-sr.top)/SC,on:a.playState==='running'});
  });
  lastY=-1;update();
}
function update(){
  busy=false;var y=window.scrollY||0;if(y===lastY)return;lastY=y;
  var H=window.innerHeight,top=(y-margin)/SC,bot=(y+H+margin)/SC,n=0;
  for(var i=0;i<list.length;i++){
    var e=list[i],vis=e.y1>top&&e.y0<bot;
    if(vis!==e.on){e.on=vis;try{vis?e.a.play():e.a.pause()}catch(x){}}
    if(vis)n++;
  }
  lastOn=n;
}
function onScroll(){if(!busy){busy=true;requestAnimationFrame(update)}}
addEventListener('scroll',onScroll,{passive:true});
addEventListener('world:layout',function(){clearTimeout(collect.t);collect.t=setTimeout(collect,400)});
// after the sky changes between day and night a new set of animations exists
window.__perfRefresh=function(){clearTimeout(collect.t);collect.t=setTimeout(collect,2300)};
setTimeout(collect,900);
window.__perf={count:function(){return {tracked:list.length,running:lastOn}}};
})();

</script>
